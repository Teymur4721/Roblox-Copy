<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #111216; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-panel { background-color: #232527; }
        .hover-panel:hover { background-color: #393b3d; }
        /* Scrollbar dizaynı */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111216; }
        ::-webkit-scrollbar-thumb { background: #393b3d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Üst Menyu (Navbar) -->
    <header class="bg-panel h-14 flex items-center px-4 justify-between border-b border-gray-800 shrink-0">
        <div class="flex items-center gap-6">
            <h1 class="text-2xl font-bold tracking-wider cursor-pointer" onclick="goHome()">ROBLOX</h1>
            <nav class="hidden md:flex gap-4 text-sm font-medium text-gray-300">
                <a href="#" class="hover:text-white">Discover</a>
                <a href="#" class="hover:text-white">Marketplace</a>
                <a href="#" class="hover:text-white">Create</a>
                <a href="#" class="hover:text-white">Robux</a>
            </nav>
        </div>
        <div class="flex-1 max-w-md mx-6">
            <div class="bg-[#111216] rounded flex items-center px-3 py-1.5 border border-gray-700">
                <svg class="w-4 h-4 text-gray-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" placeholder="Search" class="bg-transparent border-none outline-none text-sm w-full text-white placeholder-gray-400">
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 bg-gray-600 rounded-full cursor-pointer"></div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sol Menyu (Sidebar) -->
        <aside class="w-48 bg-panel hidden md:flex flex-col py-4 overflow-y-auto border-r border-gray-800 shrink-0">
            <a href="#" onclick="goHome()" class="flex items-center px-4 py-2 hover-panel gap-3 text-sm font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Home
            </a>
            <a href="#" class="flex items-center px-4 py-2 hover-panel gap-3 text-sm font-medium text-gray-400"><div class="w-5 h-5 bg-gray-600 rounded-full"></div> Profile</a>
            <a href="#" class="flex items-center px-4 py-2 hover-panel gap-3 text-sm font-medium text-gray-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg> Messages</a>
            <a href="#" class="flex items-center px-4 py-2 hover-panel gap-3 text-sm font-medium text-gray-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg> Friends</a>
            <a href="#" class="flex items-center px-4 py-2 hover-panel gap-3 text-sm font-medium text-gray-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg> Avatar</a>
        </aside>

        <!-- Əsas Məzmun (Main Content) -->
        <main class="flex-1 overflow-y-auto p-6 relative">
            
            <!-- 1. ANA SƏHİFƏ (Oyunlar Şəbəkəsi) -->
            <div id="home-view">
                <h2 class="text-xl font-bold mb-4">Recommended For You</h2>
                <!-- Oyunların düzüləcəyi yer -->
                <div id="games-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                    <!-- Javascript bura oyunları əlavə edəcək -->
                </div>
            </div>

            <!-- 2. OYUN DETALLARI SƏHİFƏSİ (Şablon) -->
            <div id="details-view" class="hidden max-w-5xl mx-auto">
                <button onclick="goHome()" class="mb-4 text-gray-400 hover:text-white flex items-center text-sm font-medium">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Home
                </button>

                <div class="flex flex-col md:flex-row gap-6">
                    <!-- Oyun Şəkli -->
                    <div class="w-full md:w-2/3">
                        <img id="detail-image" src="" alt="Game Cover" class="w-full h-auto rounded-lg shadow-lg object-cover aspect-video bg-gray-800">
                    </div>
                    
                    <!-- Oyun Məlumatları -->
                    <div class="w-full md:w-1/3 flex flex-col justify-center">
                        <h1 id="detail-title" class="text-3xl font-bold mb-2">Game Title</h1>
                        <p class="text-gray-400 text-sm mb-1">By <span id="detail-creator" class="font-medium hover:underline cursor-pointer">Creator</span></p>
                        <p class="text-gray-500 text-xs mb-6">Maturity: Minimal</p>
                        
                        <button class="bg-[#00b06f] hover:bg-[#008f5a] text-white font-bold py-3 px-8 rounded-lg w-full flex justify-center items-center gap-2 mb-4 text-lg transition-colors">
                            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>

                        <div class="flex justify-between border-t border-gray-700 pt-4 mt-2">
                            <div class="flex flex-col items-center cursor-pointer hover:text-gray-300">
                                <svg class="w-6 h-6 mb-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                                <span class="text-xs text-gray-400">Favorite</span>
                            </div>
                            <div class="flex flex-col items-center cursor-pointer hover:text-gray-300">
                                <svg class="w-6 h-6 mb-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                                <span class="text-xs text-gray-400">Follow</span>
                            </div>
                            <div class="flex flex-col items-center cursor-pointer hover:text-gray-300">
                                <svg class="w-6 h-6 mb-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path></svg>
                                <span class="text-xs text-gray-400" id="detail-likes">95%</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-8 border-b border-gray-700 flex gap-8">
                    <button class="pb-2 border-b-2 border-white font-medium text-white">About</button>
                    <button class="pb-2 font-medium text-gray-400 hover:text-white">Store</button>
                    <button class="pb-2 font-medium text-gray-400 hover:text-white">Servers</button>
                </div>
                
                <div class="mt-4 text-sm text-gray-300 leading-relaxed whitespace-pre-wrap" id="detail-description">
                    <!-- Haqqında məlumat buraya gələcək -->
                </div>
            </div>
        </main>
    </div>

    <!-- DJANGO VƏ JAVASCRIPT MƏNTİQİ -->
    <script>
        // Django-dan gələn məlumatları JavaScript array-inə çeviririk
        const gamesDatabase = [
            {% for game in games %}
            {
                id: {{ game.id }},
                title: "{{ game.title|escapejs }}",
                creator: "{{ game.creator|escapejs }}",
                likes: "{{ game.likes|escapejs }}",
                description: "{{ game.description|escapejs }}",
                {% if game.image %}
                image: "{{ game.image.url }}"
                {% else %}
                image: "https://via.placeholder.com/400x225?text=No+Image"
                {% endif %}
            },
            {% endfor %}
        ];

        const homeView = document.getElementById('home-view');
        const detailsView = document.getElementById('details-view');
        const gamesGrid = document.getElementById('games-grid');

        // Ana səhifədəki oyunları yükləmək üçün funksiya
        function renderGames() {
            gamesGrid.innerHTML = '';
            
            if(gamesDatabase.length === 0) {
                gamesGrid.innerHTML = '<p class="text-gray-400 col-span-full">Hələ heç bir oyun əlavə edilməyib. Admin paneldən əlavə edin.</p>';
                return;
            }

            gamesDatabase.forEach(game => {
                const gameCard = document.createElement('div');
                gameCard.className = 'cursor-pointer group flex flex-col';
                // Oyun kartına kliklədikdə "showGameDetails" funksiyasını çağırırıq
                gameCard.onclick = () => showGameDetails(game);

                gameCard.innerHTML = `
                    <div class="relative w-full aspect-video rounded-lg overflow-hidden bg-gray-800 mb-2">
                        <img src="${game.image}" alt="${game.title}" class="w-full h-full object-cover">
                    </div>
                    <h3 class="font-medium text-sm truncate group-hover:underline" title="${game.title}">${game.title}</h3>
                    <div class="flex items-center text-xs text-gray-400 mt-1">
                        <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 01-.8 2.4L6.8 7.933a4 4 0 00-.8 2.4z"></path></svg>
                        ${game.likes}
                    </div>
                `;
                gamesGrid.appendChild(gameCard);
            });
        }

        // Oyuna kliklədikdə məlumatları şablona dolduran funksiya
        function showGameDetails(game) {
            document.getElementById('detail-image').src = game.image;
            document.getElementById('detail-title').innerText = game.title;
            document.getElementById('detail-creator').innerText = game.creator;
            document.getElementById('detail-likes').innerText = game.likes;
            document.getElementById('detail-description').innerText = game.description;

            // Görünüşləri dəyişdiririk
            homeView.classList.add('hidden');
            detailsView.classList.remove('hidden');
        }

        // Geri (Home) düyməsinə basdıqda
        function goHome() {
            detailsView.classList.add('hidden');
            homeView.classList.remove('hidden');
        }

        // Səhifə yüklənəndə oyunları ekrana çəkirik
        renderGames();
    </script>
</body>
</html>
